[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/consensus",
    "crates/node",
    "crates/bench",
    "crates/conformance",
    "crates/storage",
    "crates/validator",
    "crates/replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"
style = "warn"

# cargo-fuzz requires debug info in release builds to get useful stack traces.
[profile.release]
debug = true

[workspace.dependencies]
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
k256 = { version = "0.13", default-features = false }
ququmatz = { path = "/home/cuarentaydos/Code/tooling/ququmatz" }
quetzalcoatl = { path = "/home/cuarentaydos/Code/tooling/quetzalcoatl" }
