[workspace]
resolver = "3"
members = [
    "crates/mantle-core",
    "crates/consensus",
    "crates/mantle-node",
    "crates/mantle-bench",
    "crates/mantle-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"
style = "warn"

# cargo-fuzz requires debug info in release builds to get useful stack traces.
[profile.release]
debug = true

[workspace.dependencies]
sha2 = { version = "0.11", default-features = false }
ququmatz = { path = "/home/cuarentaydos/Code/tooling/ququmatz" }
quetzalcoatl = { path = "/home/cuarentaydos/Code/tooling/quetzalcoatl" }
