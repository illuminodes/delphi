[workspace]
resolver = "3"
members = [
    "harness",
    "crates/oracle",
    "crates/oracled",
    "crates/dash",
    "tools/vein-preview",
    "tools/amphora-cut",
    "tools/stone-fetch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"
style = "warn"

[profile.release]
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace.dependencies]
mantle = { git = "https://github.com/illuminodes/mantle", rev = "c3a4fe41796f708e71750168794ffe36dbc5f701" }
mantle-block-io = { git = "https://github.com/illuminodes/mantle", rev = "c3a4fe41796f708e71750168794ffe36dbc5f701" }
mantle-consensus = { git = "https://github.com/illuminodes/mantle", rev = "c3a4fe41796f708e71750168794ffe36dbc5f701" }
mantle-fetcher = { git = "https://github.com/illuminodes/mantle", rev = "c3a4fe41796f708e71750168794ffe36dbc5f701" }
mantle-transport = { git = "https://github.com/illuminodes/mantle", rev = "c3a4fe41796f708e71750168794ffe36dbc5f701" }
nostro2 = { version = "0.9.0", default-features = false, features = ["serde", "k256"] }
nostro2-signer = { version = "0.8.0", default-features = false, features = ["serde", "k256"] }
nostro2-relay = "0.10.0"
quetzalcoatl = "0.15.2"
