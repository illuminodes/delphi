[workspace]
resolver = "3"
members = [
    "harness",
    "crates/oracle",
    "crates/oracled",
    "crates/dash",
    "tools/vein-preview",
    "tools/amphora-cut",
    "tools/stone-fetch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"
style = "warn"

[profile.release]
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace.dependencies]
mantle = { path = "../mantle/crates/mantle" }
mantle-block-io = { path = "../mantle/crates/block-io" }
mantle-consensus = { path = "../mantle/crates/consensus" }
mantle-fetcher = { path = "../mantle/crates/fetcher" }
mantle-transport = { path = "../mantle/crates/transport" }
nostro2 = { path = "/home/cuarentaydos/Code/illuminodes/NostrO2/crates/core", default-features = false, features = ["serde", "k256"] }
nostro2-signer = { path = "/home/cuarentaydos/Code/illuminodes/NostrO2/crates/signer", default-features = false, features = ["serde", "k256"] }
nostro2-relay = { path = "/home/cuarentaydos/Code/illuminodes/NostrO2/crates/relay" }

[patch.crates-io]
quetzalcoatl = { path = "/home/cuarentaydos/Code/tooling/quetzalcoatl" }
