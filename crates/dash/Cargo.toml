[package]
name = "delphi-dash"
version = "0.1.0"
edition = "2021"
description = "Client-side PWA dashboard for the delphi-oracled price feed"

[lib]
name = "delphi_dash"
path = "src/lib.rs"

[[bin]]
name = "delphi-dash"
path = "src/main.rs"

[dependencies]
nostr-minions = "0.5.1"
yew = { version = "0.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "MediaQueryList", "Location", "Storage", "HtmlInputElement", "InputEvent", "Event", "EventTarget",
    "Element", "DomRect", "MouseEvent", "PointerEvent", "ResizeObserver",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = "0.6"

