<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Live Bitcoin price windows from the Delphi on-chain oracle." />
    <meta name="theme-color" content="#0b0d10" />
    <title>Delphi · Bitcoin price oracle</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/icon.svg" />
    <link data-trunk rel="copy-file" href="public/sw.js" />
    <link data-trunk rel="css" href="styles/main.css" />
    <link data-trunk rel="rust" data-bin="delphi-dash" data-cargo-profile-release="wasm-release" data-wasm-opt="z" />
</head>
<body>
    <script>
        (function () {
            var saved = localStorage.getItem("delphi-dash.color-scheme");
            var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.dataset.theme = light ? "light" : "dark";
        })();
    </script>
    <noscript>This dashboard needs JavaScript and WebAssembly.</noscript>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () {});
            });
        }
    </script>
</body>
</html>
