[package]
name = "mantle-bench"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "network"
harness = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "consensus"
harness = false

[[bench]]
name = "script"
harness = false

[[bench]]
name = "replay"
harness = false

[[bin]]
name = "dhat-profile"
path = "src/dhat_profile.rs"

[[bin]]
name = "perf-driver"
path = "src/perf_driver.rs"

[[bin]]
name = "replay-dhat"
path = "src/replay_dhat.rs"

[[bin]]
name = "replay-perf"
path = "src/replay_perf.rs"

[[bin]]
name = "replay-perf-a"
path = "src/replay_perf_a.rs"

[[bin]]
name = "replay-perf-b"
path = "src/replay_perf_b.rs"

[[bin]]
name = "replay-perf-c"
path = "src/replay_perf_c.rs"

[[bin]]
name = "fetch-fixtures"
path = "src/fetch_fixtures.rs"

[[bin]]
name = "replay-mainnet"
path = "src/replay_mainnet.rs"

[[bin]]
name = "replay-perf-ordinals"
path = "src/replay_perf_ordinals.rs"

[[bin]]
name = "replay-dhat-ordinals"
path = "src/replay_dhat_ordinals.rs"

[dependencies]
mantle = { path = "../core" }
mantle-consensus = { path = "../consensus" }
mantle-storage = { path = "../storage" }
mantle-validator = { path = "../validator" }
dhat = "0.3"
k256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
sha2 = { workspace = true }
ripemd = { workspace = true }

[dev-dependencies]
divan = "0.1"
