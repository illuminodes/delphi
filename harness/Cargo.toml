[package]
name = "delphi-harness"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "delphi_harness"
path = "src/lib.rs"

[[bin]]
name = "oracle-harness"
path = "src/main.rs"

[[bin]]
name = "oracle-granularity"
path = "src/bin/granularity_sweep.rs"

[[bin]]
name = "mempool-spike"
path = "src/bin/mempool_spike.rs"

[[bin]]
name = "oracle-convergence"
path = "src/bin/sample_convergence.rs"

[[bin]]
name = "mempool-convergence"
path = "src/bin/mempool_convergence.rs"

[[bin]]
name = "oracle-sample-compare"
path = "src/bin/sample_compare.rs"

[[bin]]
name = "oracle-stencil-eras"
path = "src/bin/stencil_eras.rs"

[[bin]]
name = "oracle-anchor"
path = "src/bin/anchor_eras.rs"

[[bin]]
name = "oracle-volatility"
path = "src/bin/volatility_probe.rs"

[dependencies]
mantle = { workspace = true }
delphi-oracle = { path = "../crates/oracle" }
ureq = "3"
