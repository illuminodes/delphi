[dependencies]
mantle = { path = "../crates/mantle" }
mantle-consensus = { path = "../crates/consensus" }
mantle-storage = { path = "../crates/storage" }
mantle-transport = { path = "../crates/transport" }
mantle-validator = { path = "../crates/validator" }
ququmatz.workspace = true
dhat = "0.3"
tempfile = "3"
pprof = { version = "0.14", features = ["flamegraph"] }
k256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
sha2 = { workspace = true }
ripemd = { workspace = true }

[dev-dependencies]
divan = "0.1"
bitcoinconsensus = { workspace = true }
