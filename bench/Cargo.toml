[package]
name = "mantle-bench"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "mantle"
harness = false

[[bench]]
name = "consensus"
harness = false

[[bench]]
name = "script"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "replay"
